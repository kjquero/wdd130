<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>Basic HTML & CSS Quiz</h1>
    <form>
        <label for="q1">1. Which CSS property is used to change the background color of an
            element?</label>
        <input type="text" id="q1" name="q1">

        <label for="q2">2. Explain the difference between margin and padding in CSS.</label>
        <textarea id="q2" name="q2"></textarea>

        <label for="q3">3. Which HTML tag is used to create a hyperlink?</label>
        <select name="q3" id="q3">
            <option value="" selected disabled>Choose one...</option>
            <option value="option1">link</option>
            <option value="option2">a</option>
            <option value="option3">href</option>
        </select>

        <label for="q4">4. How many heading levels are available in HTML?</label>
        <input type="number" name="q4" id="q4">

        <button type="submit">Submit Quiz</button>

    </form>
</body>

</html>
